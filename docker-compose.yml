services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taxman
      POSTGRES_USER: taxman
      POSTGRES_PASSWORD: taxman
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - taxman_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxman -d taxman"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://taxman:taxman@db:5432/taxman?schema=public
      APP_ORIGIN: http://localhost:3001
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-taxman-local-compose-secret-change-before-production}
      PERSONAL_DATA_ENCRYPTION_KEY: ${PERSONAL_DATA_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      PERSONAL_DATA_INDEX_KEY: ${PERSONAL_DATA_INDEX_KEY:-AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=}
      TAXMAN_ADMIN_EMAIL: ${TAXMAN_ADMIN_EMAIL:-admin@taxman.local}
      TAXMAN_ADMIN_PASSWORD: ${TAXMAN_ADMIN_PASSWORD:-TaxMan-local-2026!}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:3000
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  taxman_postgres:
